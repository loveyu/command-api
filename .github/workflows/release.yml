name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  verify:
    name: Verify ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            runner: ubuntu-latest
          - name: Linux ARM64
            runner: ubuntu-24.04-arm
          - name: Windows x86_64
            runner: windows-latest
          - name: Windows ARM64
            runner: windows-11-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings

  build-linux:
    name: Build ${{ matrix.package }}
    needs: verify
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            package: linux-x86_64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            package: linux-aarch64
          - runner: ubuntu-latest
            target: armv7-unknown-linux-gnueabihf
            package: linux-armv7
            apt_package: gcc-arm-linux-gnueabihf
    steps:
      - uses: actions/checkout@v4
      - name: Install cross linker
        if: matrix.apt_package
        run: |
          sudo apt-get update
          sudo apt-get install --yes "${{ matrix.apt_package }}"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --locked --target "${{ matrix.target }}"
      - name: Package
        shell: bash
        run: |
          mkdir -p dist/package/scripts
          cp "target/${{ matrix.target }}/release/command-api" dist/package/
          cp README.md config.example.yaml dist/package/
          cp scripts/example.sh scripts/example.ps1 dist/package/scripts/
          tar -C dist/package -czf "dist/command-api-${GITHUB_REF_NAME}-${{ matrix.package }}.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}
          path: dist/*.tar.gz

  build-windows:
    name: Build ${{ matrix.package }}
    needs: verify
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            package: windows-x86_64
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            package: windows-aarch64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --locked --target "${{ matrix.target }}"
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/package/scripts | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/command-api.exe" dist/package/
          Copy-Item README.md,config.example.yaml dist/package/
          Copy-Item scripts/example.sh,scripts/example.ps1 dist/package/scripts/
          Compress-Archive -Path dist/package/* -DestinationPath "dist/command-api-$env:GITHUB_REF_NAME-${{ matrix.package }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}
          path: dist/*.zip

  publish:
    name: Publish GitHub Release
    needs:
      - build-linux
      - build-windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/* --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
