name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            runner: ubuntu-latest
          - name: Linux ARM64
            runner: ubuntu-24.04-arm
          - name: Windows x86_64
            runner: windows-latest
            artifact: windows-x86_64-ci
          - name: Windows ARM64
            runner: windows-11-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Test
        run: cargo test --locked
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Build release binary
        run: cargo build --release --locked
      - name: Upload Windows test binary
        if: matrix.artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: target/release/command-api.exe
          if-no-files-found: error

  build-linux-armv7:
    name: Linux ARMv7 cross-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ARMv7 linker
        run: |
          sudo apt-get update
          sudo apt-get install --yes gcc-arm-linux-gnueabihf
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-unknown-linux-gnueabihf
      - uses: Swatinem/rust-cache@v2
        with:
          key: armv7-unknown-linux-gnueabihf
      - run: cargo build --release --locked --target armv7-unknown-linux-gnueabihf
