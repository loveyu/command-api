server:
  # 每个监听端点可使用不同地址和端口，所有端点共享路由和安全策略。
  listeners:
    - host: 192.168.1.10
      port: 27415
    - host: 127.0.0.1
      port: 27416
  # 旧版 host + port，以及多个地址共用端口的 hosts + port 写法仍兼容。

access:
  # 至少一个 CIDR。请尽量缩小范围，不建议配置 0.0.0.0/0 或 ::/0。
  allowed_cidrs:
    - 192.168.1.0/24
  token_failure_cooldown:
    enabled: true
    seconds: 10
    max_tracked_ips: 4096

# 未配置 tls 时使用明文 HTTP；需要加密时取消下列注释。启用 TLS 后强制使用 mTLS。
# 服务器证书必须覆盖全部监听地址，证书和私钥路径相对于本配置文件。
# tls:
#   certificate: ./tls/server.crt
#   private_key: ./tls/server.key
#   client_ca_certificate: ./tls/client-ca.crt

auth:
  # 跨平台可从进程环境读取，不允许在 YAML 中直接保存 Token。
  token:
    provider: environment
    variable: COMMAND_API_TOKEN
  # 也可以将标准 PBKDF2-HMAC-SHA256 PHC Hash 直接保存在配置中；使用 secret hash 生成。
  # token:
  #   provider: pbkdf2_sha256
  #   hash: '$pbkdf2-sha256$i=600000,l=32$...'
  # Windows 推荐改用以下 DPAPI 密钥文件：
  # token:
  #   provider: windows_dpapi
  #   file: ./secrets/token.dpapi

logging:
  directory: ./logs
  retention_seconds: 86400
  max_output_bytes_per_task: 104857600

execution:
  max_total_concurrency: 16
  shutdown_timeout_seconds: 30

windows_service:
  name: command-api
  display_name: Command API
  description: 通过受控 HTTP API 异步执行预配置脚本
  account: local_service

routes:
  # Linux/macOS，或已经安装 bash 的 Windows 环境。
  - path: /commands/example-shell
    executor: bash
    script: ./scripts/example.sh
    fixed_args:
      - fixed-from-config
    request_args:
      enabled: true
      max_count: 32
      max_item_bytes: 4096
      max_total_bytes: 16384
      allowed_patterns:
        - '^[A-Za-z0-9._ -]{1,128}$'
    max_concurrency: 2
    max_execution_seconds: 300
    graceful_shutdown_seconds: 10
    merge_stdout_stderr: false
    output_encoding: utf-8

  # Windows 推荐使用 PowerShell 7（pwsh）；也可以改为 powershell 使用 5.1。
  - path: /commands/example-powershell
    executor: pwsh
    script: ./scripts/example.ps1
    fixed_args:
      - fixed-from-config
    request_args:
      enabled: true
      max_count: 32
      max_item_bytes: 4096
      max_total_bytes: 16384
      allowed_patterns:
        - '^[A-Za-z0-9._ -]{1,128}$'
    max_concurrency: 2
    max_execution_seconds: 300
    graceful_shutdown_seconds: 10
    merge_stdout_stderr: true
    output_encoding: utf-8
